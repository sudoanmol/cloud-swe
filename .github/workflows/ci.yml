name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm fmt:check
      - run: pnpm knip

  leaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -fsSLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_8.30.1_checksums.txt"
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          rm gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_checksums.txt
      - run: ./gitleaks git --redact --no-banner --log-level warn

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The default Docker builder can't export a cache; the runtime action hands compose.ci.yaml the cache's URL and token.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # Protocol and server tests, inside Docker. Typecheck runs in checks, beside them.
      - run: node scripts/test.mjs
        env:
          COMPOSE_FILE: compose.yaml:compose.ci.yaml

  deploy:
    if: github.event_name == 'push'
    needs: [checks, leaks, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler appends each deploy's URLs here, as one JSON line per Worker.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
      # An unsigned request must get 401: that proves the new Worker boots and routes. A 5xx means the deploy is broken.
      - name: Check the deployed Worker
        run: |
          url=$(jq -r 'select(.type == "deploy" and .worker_name == "cloud-swe-server") | first(.targets[] | select(startswith("https://")))' "$RUNNER_TEMP/wrangler-output.ndjson")
          test -n "$url" || { echo "::error::Wrangler reported no URL for cloud-swe-server"; exit 1; }
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url/v1/sessions")
          test "$status" = 401 || { echo "::error::$url/v1/sessions answered HTTP $status, expected 401"; exit 1; }
