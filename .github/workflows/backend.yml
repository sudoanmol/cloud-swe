name: Backend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: cp .env.example .env
      - run: bun install --frozen-lockfile
      - run: bun run infra:up
      - run: docker build -t cloud-swe-local-tests -f apps/runner/tests/Dockerfile .
      - run: bun run check-types
      - run: bunx oxlint
      - run: bunx knip
      - run: bunx oxfmt --check
      - name: Test
        run: rg --files apps packages -g '*test.ts' -0 | xargs -0 bun test --coverage
      # Bun's coverageThreshold applies to every file; this floor applies to the repository total.
      - name: Coverage floor
        run: >-
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} /^FNF:/{fnf+=$2} /^FNH:/{fnh+=$2}
          END{printf "lines %.1f%%, functions %.1f%%\n", lh/lf*100, fnh/fnf*100; exit !(lh/lf >= 0.68 && fnh/fnf >= 0.80)}'
          coverage/lcov.info
      - if: always()
        run: docker compose down -v
