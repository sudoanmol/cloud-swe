name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: bun run infra:up
      - run: docker build -t cloud-swe-local-tests -f apps/runner/tests/Dockerfile .
      - name: Backend types
        run: |
          bunx tsc -p apps/runner/tsconfig.json --noEmit --incremental false
          bunx tsc -p apps/runner/tests/tsconfig.json --noEmit --incremental false
          bunx tsc -p apps/server/tsconfig.json --noEmit --composite false --incremental false
          bunx tsc -p packages/api/tsconfig.json --noEmit --composite false --incremental false
          bunx tsc -p packages/auth/tsconfig.json --noEmit --composite false --incremental false
      - run: bunx oxlint
      - run: bunx oxfmt --check apps/runner apps/server packages/api/src/routers packages/api/src/http.ts packages/db packages/auth
      - name: Unit, HTTP, database, guest, SDK, and replay regressions
        run: bun test packages/db/tests packages/api/tests apps/server/tests apps/runner/tests/activity-scope.test.ts apps/runner/tests/demo-policy.test.ts apps/runner/tests/pi.test.ts apps/runner/tests/pi-lifecycle.test.ts apps/runner/tests/pi-checkpoint-compat.test.ts apps/runner/tests/remote-tools.test.ts apps/runner/tests/guest-command.test.ts apps/runner/tests/parallel-tools.test.ts apps/runner/tests/execution-coordinator.test.ts apps/runner/tests/thread-workflow.test.ts apps/runner/tests/workflow-replay.test.ts apps/runner/tests/config.test.ts
      - run: bun run test:backend
      - if: always()
        run: docker compose down -v
