; Docker. A restored sandbox keeps the previous filesystem, so each program
; clears the stale locks its last run left behind.

; Oxlint JS plugins reserve about 4 GiB of virtual memory per worker, which the
; default overcommit heuristic refuses on a 4 GiB sandbox (oxc-project/oxc#20331).
; Kernel settings do not survive a restore, so this runs on every boot.
[program:overcommit]
command=/usr/sbin/sysctl -w vm.overcommit_memory=1
priority=1
autorestart=false
startsecs=0

[program:dockerd]
command=/bin/bash -c 'rm -f /var/run/docker.pid /run/docker/containerd/containerd.pid; exec /usr/bin/dockerd'
priority=10
autorestart=true
startsecs=2
