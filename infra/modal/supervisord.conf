; Docker and the desktop stack. A restored sandbox keeps the previous
; filesystem, so each program clears the stale locks its last run left behind.

[program:dockerd]
command=/bin/bash -c 'rm -f /var/run/docker.pid /run/docker/containerd/containerd.pid; exec /usr/bin/dockerd'
priority=10
autorestart=true
startsecs=2

[program:xvfb]
command=/bin/bash -c 'rm -f /tmp/.X99-lock /tmp/.X11-unix/X99; exec /usr/bin/Xvfb :99 -screen 0 1440x900x24 -nolisten tcp -ac'
priority=20
autorestart=true

[program:openbox]
command=/bin/bash -c 'for i in {1..30}; do xdpyinfo >/dev/null 2>&1 && exec /usr/bin/openbox --sm-disable; sleep 1; done; exit 1'
user=sandbox
environment=DISPLAY=":99",HOME="/home/sandbox"
priority=30
autorestart=true

[program:x11vnc]
command=/bin/bash -c 'for i in {1..30}; do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && exec /usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -noxdamage; sleep 1; done; exit 1'
priority=30
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
priority=40
autorestart=true

[program:chromium]
command=/bin/bash -c 'mkdir -p "$HOME/.config/chromium-headed"; rm -f "$HOME"/.config/chromium-headed/Singleton*; for i in {1..30}; do xdpyinfo >/dev/null 2>&1 && exec /usr/bin/dbus-run-session -- /usr/local/bin/chromium --disable-dev-shm-usage --no-first-run --no-default-browser-check --disable-default-apps --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --remote-allow-origins=* --user-data-dir="$HOME/.config/chromium-headed" --window-size=1440,900 --window-position=0,0 about:blank; sleep 1; done; exit 1'
user=sandbox
environment=DISPLAY=":99",HOME="/home/sandbox"
priority=40
autorestart=true
