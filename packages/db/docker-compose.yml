name: cloud-swe

services:
  postgres:
    image: postgres:18
    container_name: cloud-swe-postgres
    environment:
      POSTGRES_DB: cloud-swe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - cloud-swe_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  cloud-swe_postgres_data:
